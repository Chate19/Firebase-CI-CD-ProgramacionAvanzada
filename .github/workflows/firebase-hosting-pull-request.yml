# ─────────────────────────────────────────────────────────────────────────────
#  Pipeline de PREVIEW: cada Pull Request se despliega en un "preview channel"
#  de Firebase Hosting (URL propia, temporal, aislada de producción).
# ─────────────────────────────────────────────────────────────────────────────
name: Preview en Pull Request

# A1: cada Pull Request contra main dispara el pipeline.
on:
  pull_request:
    branches:
      - main

# A4: si se pushea de nuevo al mismo PR, cancelamos el build anterior.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write # la action comenta la URL del preview en el PR

jobs:
  build_and_preview:
    # Los PRs desde forks no reciben secretos: no intentamos desplegar.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Compilamos exactamente el último commit del PR (no el merge commit).
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # A2: el footer muestra el SHA del último commit del PR y su rama.
      # El postbuild de `npm run build` genera firebase.json con los hashes
      # CSP de los scripts inline de este build.
      - name: Build (export estático)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
          NEXT_PUBLIC_BUILD_REF: ${{ github.head_ref }}
          NEXT_PUBLIC_BUILD_TIME: ${{ github.event.pull_request.updated_at }}

      # A3: preview con vencimiento de 3 días.
      - name: Deploy a preview channel
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRACTICA_CICD_CHATE }}
          projectId: practica-cicd-chate
          expires: 3d

      # Gate: el preview no se considera válido si perdió headers o caché.
      # Reintentamos por si el CDN tarda unos segundos en propagar el release.
      - name: Verificar headers del preview
        run: |
          for intento in 1 2 3 4 5 6; do
            echo "Intento $intento..."
            if node scripts/check-headers.mjs "${{ steps.deploy.outputs.details_url }}"; then
              exit 0
            fi
            sleep 5
          done
          echo "❌ La verificación falló tras 6 intentos."
          exit 1
