# ─────────────────────────────────────────────────────────────────────────────
#  Pipeline de PRODUCCIÓN: lo que se mergea a `main` se publica en el canal
#  `live` de Firebase Hosting.
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy a producción

# A1: cada push a main dispara el pipeline.
on:
  push:
    branches:
      - main

# A4: los deploys de producción se encolan, pero nunca se cancelan a mitad.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # A5: GitHub Environment `production` (permite exigir aprobación manual).
    environment:
      name: production
      url: https://practica-cicd-chate.web.app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # A2: el footer muestra el SHA de main y el nombre de la rama.
      # El postbuild de `npm run build` genera firebase.json con los hashes
      # CSP de los scripts inline de este build.
      - name: Build (export estático)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
          NEXT_PUBLIC_BUILD_REF: ${{ github.ref_name }}
          NEXT_PUBLIC_BUILD_TIME: ${{ github.event.head_commit.timestamp }}

      # A3: `channelId: live` publica en producción.
      - name: Deploy al canal live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRACTICA_CICD_CHATE }}
          projectId: practica-cicd-chate
          channelId: live

      # Gate: verificamos la URL pública recién publicada.
      - name: Verificar headers en producción
        run: node scripts/check-headers.mjs "https://practica-cicd-chate.web.app"
